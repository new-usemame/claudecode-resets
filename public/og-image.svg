<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.1" fill="#26201a" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#fff4dd"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- the site mark, drawn at its own coordinates and scaled once -->
  <g transform="translate(90,110) scale(2.9)">
    <rect x="2" y="2" width="40" height="40" rx="12" fill="#ff5c2b" stroke="#26201a" stroke-width="3"/>
    <g fill="none" stroke="#fffdf7" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 22a10 10 0 1 1-3.1-7.2"/>
      <path d="M29.4 8.6v6.6h-6.6"/>
    </g>
  </g>

  <text x="248" y="200" font-family="Baloo 2, Arial Rounded MT Bold, Verdana, sans-serif" font-size="80"
        font-weight="800" fill="#26201a">Claude Code Resets</text>

  <text x="92" y="300" font-family="Verdana, DejaVu Sans, sans-serif" font-size="26" fill="#5c5347">
    We watch @ClaudeDevs for reset announcements, so you don&#8217;t have to.</text>

  <g transform="translate(92,344)">
    <rect x="0" y="0" width="1016" height="150" rx="20" fill="#fffdf7" stroke="#26201a" stroke-width="6"/>
    <text x="32" y="52" font-family="Verdana, sans-serif" font-size="26" fill="#26201a">
      How long since Anthropic last reset Claude Code limits,</text>
    <text x="32" y="90" font-family="Verdana, sans-serif" font-size="26" fill="#26201a">
      and how often it actually happens.</text>
    <text x="32" y="128" font-family="Verdana, sans-serif" font-size="22" fill="#5c5347">
      Full history &#183; every announcement verbatim &#183; free API &#183; alerts</text>
  </g>

  <g transform="translate(92,518)">
    <rect x="0" y="0" width="146" height="44" rx="12" fill="#ffd84d" stroke="#26201a" stroke-width="5"/>
    <text x="22" y="30" font-family="Verdana, sans-serif" font-size="19" fill="#26201a">full reset</text>
    <rect x="162" y="0" width="176" height="44" rx="12" fill="#ffb07a" stroke="#26201a" stroke-width="5"/>
    <text x="184" y="30" font-family="Verdana, sans-serif" font-size="19" fill="#26201a">partial reset</text>
  </g>

  <text x="92" y="600" font-family="Verdana, sans-serif" font-size="21" fill="#877b6b">
    claudecode-resets.com &#183; independent, not affiliated with Anthropic</text>
</svg>